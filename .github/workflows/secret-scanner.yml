# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Single secret scanner. The standards reusable runs gitleaks (+ a Rust-secrets
# check). An inline TruffleHog job previously lived here, but the reusable
# DELIBERATELY retired TruffleHog as redundant (gitleaks gives sufficient
# coverage at lower cost — see the reusable's header). Re-adding it was
# duplicated work, not extra coverage, so it has been removed. See
# .github/workflows/README.adoc.
#
# Since standards#500 the reusable runs gitleaks as a pinned checksum-verified
# binary, so `contents: read` is the WHOLE permission requirement — the old
# guidance to grant `pull-requests: write` + `actions: read` is obsolete, and
# granting extras a reusable job doesn't request is how the estate's own
# wrapper got startup-rejected. Shape below matches the reusable's documented
# canonical caller exactly.
jobs:
  scan:
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@1acabd27e4517fd690b73815de25ae8806c942f0
    secrets: inherit
